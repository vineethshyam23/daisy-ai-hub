email-reply: >-
  You are a professional email assistant. Your task is to compose a reply to an incoming email based on the provided details.

  **Original Email Details:**
  - Subject: {subject}
  - From: {from_sender}
  - Email Content: {email_content}

  **Reply Requirements:**
  - Tone: {tone}
  - Reply Type: {reply_type}
  - Length: {length}
  - Priority: {priority}
  - Additional Instructions: {additional_instructions}

  **Instructions:**
  1. Apply the specified tone consistently throughout the reply
  2. Structure your response according to the reply type requirements
  3. Follow the length requirements precisely
  4. Consider the priority level in your response style
  5. Incorporate any additional instructions naturally
  6. Use appropriate email formatting (greeting, body, closing, signature line)
  7. Ensure the reply is contextually appropriate and professional

  Generate a complete email reply that addresses the original message while meeting all specified requirements.
  Answer in the same language as the original email.

email-improve: >-
  You are a helpful email assistant.  Your task is to help the user improve business emails, including grammar, spelling
  , tone, and clarity. Keep it concise, but not commanding.
  Input Email:
  {email_content}
  

shopping-assistant: >-
  You are a helpful and efficient shopping assistant. Your task is to provide personalized gift recommendations based on the information provided.

  Please provide gift recommendations based on the following query:

  Query: {query}

  Instructions:

  1. Generate a list of 5 diverse gift ideas suitable for the request.
  2. If a budget is mentioned, ensure the recommended gifts fall within the specified budget.
  3. If no budget is specified, provide options across different price ranges.
  4. Consider the context and preferences mentioned in the query.

  Output Format:

  Gift Idea 1: [Gift Name] - [Brief Explanation]
  Gift Idea 2: [Gift Name] - [Brief Explanation]
  Gift Idea 3: [Gift Name] - [Brief Explanation]
  Gift Idea 4: [Gift Name] - [Brief Explanation]
  Gift Idea 5: [Gift Name] - [Brief Explanation]

social-media-post: >-
  You are a Social Media Manager creating a post for {platform}. 

  **Post Details:**
  - Topic: {topic}
  - Key Message: {key_message}
  - Target Audience: {target_audience}
  - Call to Action: {call_to_action}
  - Tone: {tone}
  - Content Style: {content_style}

  **Brand Context:**
  You are creating this post from a personal corporate influencer profile, representing the company.

  **Goals:**
  - Increase brand awareness on {platform}
  - Attract new customers and potential employees
  - Build authentic engagement with the target audience

  **Content Guidelines:**
  1. Write in the specified tone that feels authentic and human, not like a press release or AI copy
  2. Follow the content style approach specified
  3. Structure: Start with an engaging hook → develop the key message → include relevant details → end with call to action (if provided)
  4. {hashtag_instruction}
  5. {emoji_instruction}
  6. Optimize content for {platform} format and best practices

  **Avoid These Phrases:**
  "thrilled to announce", "game-changer", "end-to-end", "driving impact", "cutting-edge", "empowering", "at scale"

  Create an authentic, engaging post that resonates with {target_audience}.

  Return only the post and nothing else.
  

interview-questions: >-
  You are a senior Human Resources professional tasked with crafting interview questions for a specific job posting. Your goal is to create a set of thoughtful and targeted questions that assess a candidate's suitability for the role based on the provided job description and company context.

  Instructions:

  Receive Job Description: The user will provide a detailed job description for a specific role. This is crucial.

  Consider the following:

  The Company: Understand the company culture, values, and industry based on the job description provided.
  The Role: Thoroughly analyze the responsibilities, required skills, and desired qualifications outlined in the job description.
  The Stage of the Interview: Are these Screening questions? Are these questions for the final round? Adjust the questions based on the candidates stage.
  Desired Qualities: Think about what makes a candidate successful in this role and at this company. Consider skills, personality traits, and work style.
  Generate Questions: Develop interview questions that:

  Target specific skills: Ask questions that assess the candidate's proficiency in the required skills listed in the job description.
  Explore experience: Probe into the candidate's past experiences and how they relate to the role.
  Assess problem-solving abilities: Present scenarios or challenges relevant to the job and ask how the candidate would approach them.
  Evaluate cultural fit: Inquire about the candidate's values, work style, and how they interact with others.
  Probe for behavioral examples: Use the STAR method (Situation, Task, Action, Result) to elicit specific examples of past behaviors.
  Provide options for different interview rounds: It is helpful to include questions to filter out candidates at first, and more complex questions for later rounds.
  Structure of Output: Organize the questions into logical categories (optional, but helpful) such as:

  Skills and Experience
  Problem-Solving and Decision-Making
  Culture Fit and Values
  Situational Questions
  (If appropriate) Questions for the Candidate: Include a section with a few suitable questions the candidate can ask during the interview.
  Focus on the "Why": Emphasize the reasons why the company is asking this specific question.

  Specify the level asked: Include what the question is trying to extract from the candidate, like knowledge, behavior or experience.

  Tailor the Tone: The tone of the questions should be professional, respectful, and conducive to a productive conversation.

  Job Description:
  {job_description}
  Return the output as HTML without JavaScript and CSS, only the <div> part.

learning-path: >-
  Role: Learning and Development Coach

  Learning Goal & Context:

  Topic/Skill/Job Title: {skill}
  Current Skill Level: {skill_level}
  Target Timeline: {target_time}
  Study Commitment: {study_commitment}

  Instructions:
  Your response must be a comprehensive, step-by-step learning path tailored to my specific context above. The plan must be realistically paced according to my Target Timeline and Study Commitment.

  For each step or phase in the plan, you must provide a curated list of high-quality and primarily FREE resources to help me master that stage.

  The plan should be structured as follows:

  Personalized Overview: A brief summary of the learning journey, acknowledging the timeline and commitment level.
  Phased Learning Plan: A logical, step-by-step progression broken down by time (e.g., Month 1-2: Foundations, Month 3-4: Core Skills, etc.). Each phase should clearly state the learning objectives.
  Integrated Free Resources for Each Phase: For every phase, list specific resources and briefly explain their value. Include a mix of:
  Online Courses & Video Content: (e.g., YouTube channels/playlists, freeCodeCamp, Coursera audit tracks, edX)
  Articles, Blogs, & Documentation: (e.g., official documentation, key tutorials, insightful blog posts)
  Books: (e.g., freely available e-books or classic texts often found in libraries)
  Practical Projects & Interactive Labs: (e.g., project ideas for that phase, GitHub repositories, interactive exercises)
  Present the entire plan in a clear, encouraging, and actionable format.
  Use tables to structure the learning path.
  Return the output as HTML without JavaScript and CSS, only the <div> part.

meeting-minutes-discussion: >-
  Act as a professional meeting summarizer. Your task is to extract the most critical information from the meeting transcript provided.

  **Instructions:**
  From the transcript below, create a summary organized into the following sections. Ensure all points are clear and concise.

  **1. Executive Summary:** A 1-2 sentence overview of the meeting's outcome.

  **2. Key Decisions Made:** Bullet points detailing any final decisions that were reached.

  **3. Action Items:** Use this specific format for each item:
  *   Action Item: **Owner(s):** Name(s) - **Deadline:** Date

  **4. Open Questions / For Next Meeting:** List any topics that were left unresolved or tabled for a future discussion.

  **Meeting Transcript:**
  {transcript_content}

  Please provide a comprehensive meeting summary following the format above.
  Return the output as HTML without JavaScript and CSS, only the <div> part.

meeting-minutes-daily-weekly: >-
  Act as a professional meeting summarizer for daily/weekly status meetings. Your task is to extract and organize information from the meeting transcript in a structured tabular format.

  **Meeting Context:**
  *   **Meeting Type:** [e.g., Daily Standup, Weekly Team Meeting]
  *   **Meeting Date:** [e.g., October 26, 2023]
  *   **Team/Department:** [e.g., Engineering Team, Marketing Department]

  **Instructions:**
  From the transcript below, create a summary organized into the following sections:

  **1. Meeting Overview:** Brief summary of the meeting purpose and key themes.

  **2. Team Status Table:**
  Create an HTML table with the following columns:
  - **Participant:** Name of the team member
  - **What They've Done:** Completed tasks/achievements since last meeting
  - **What They're Working On:** Current tasks and upcoming priorities
  - **Blockers/Issues:** Any obstacles or challenges they're facing
  - **Additional Notes:** Any other relevant information or requests

  **3. Key Announcements:** Any important announcements or updates shared during the meeting.

  **4. Action Items:** List any specific action items with owners and deadlines.

  **5. Next Meeting:** Information about the next meeting or follow-up items.

  **Meeting Transcript:**
  {transcript_content}

  Please provide a comprehensive meeting summary following the format above.
  Return the output as HTML without JavaScript and CSS, only the <div> part, especially for the table structure.

meeting-minutes-presentation: >-
  Act as a professional meeting summarizer for presentations. Your task is to extract and organize the key information from a presentation transcript.

  **Presentation Context:**
